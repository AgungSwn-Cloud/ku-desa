<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keuangan Desa Candi Badut</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keuangan Desa">
  <style>
    html, body { margin: 0; height: 100%; background: #0f766e; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f4f6; }
    #muat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f766e, #134e4a); transition: opacity .3s; z-index: 2; }
    #muat.selesai { opacity: 0; pointer-events: none; }
    .putar { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: putar 1s linear infinite; }
    @keyframes putar { to { transform: rotate(360deg); } }
    #muat a { color: #ccfbf1; font-size: 13px; }
    #cadangan { display: none; }
  </style>
</head>
<body>
  <div id="muat">
    <div class="putar"></div>
    <div><b>Keuangan Desa Candi Badut</b></div>
    <div style="font-size:13px;opacity:.85">Memuat aplikasi…</div>
    <a id="cadangan" target="_blank" rel="noopener">Tidak muncul? Buka aplikasi di tab baru</a>
  </div>
  <iframe id="app" title="Keuangan Desa Candi Badut" allow="clipboard-write"></iframe>
  <script>
    var URL_APP = 'https://script.google.com/macros/s/AKfycbxXw8D_NxSDXC6h1Rmg-xOhZy-Dckcy6IuzEnZbaXrr3m42VU8SPsR2lb3XGlK3GWg8/exec';
    var frame = document.getElementById('app');
    var muat = document.getElementById('muat');
    var cadangan = document.getElementById('cadangan');
    cadangan.href = URL_APP;
    frame.src = URL_APP;
    frame.addEventListener('load', function () { muat.classList.add('selesai'); });
    setTimeout(function () { cadangan.style.display = 'inline'; }, 8000);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
